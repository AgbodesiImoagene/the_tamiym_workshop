# Core stack: docker compose up -d
#
# Observability (OTLP → collector → Jaeger + Prometheus; explore in Grafana):
#   docker compose --profile observability up -d
#
# Set in apps/api .env.local:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
#
# UIs: Jaeger http://localhost:16686  Prometheus http://localhost:9090
#      Grafana http://localhost:3333 (anonymous admin for local use)

services:
  postgres:
    image: postgres:16-alpine
    container_name: tamiym-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tamiym_workshop
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tamiym-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tamiym-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: tamiym-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/tamiym-assets || true"

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: tamiym-jaeger
    profiles:
      - observability
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
    # OTLP gRPC 4317 / HTTP 4318 stay on the Docker network for the collector only

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    container_name: tamiym-otel-collector
    profiles:
      - observability
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tamiym-prometheus
    profiles:
      - observability
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.5.0
    container_name: tamiym-grafana
    profiles:
      - observability
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: http://localhost:3333
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '3333:3000'
    depends_on:
      - prometheus
      - jaeger

volumes:
  postgres_data:
  redis_data:
  minio_data:
