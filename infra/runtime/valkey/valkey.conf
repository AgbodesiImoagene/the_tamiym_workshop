# Host-local Valkey for The Tamiym Workshop (TTW-064 / TTW-063).
# NOT DigitalOcean Managed Valkey — runs as a non-root container on the app Droplet.
#
# Invariants:
# - maxmemory 256mb (matches TTW-060 resource budget)
# - maxmemory-policy noeviction (never silently drop queue/idempotency/session keys)
# - requirepass from environment (VALKEY_PASSWORD); never commit secrets
# - bind loopback / Compose network only — never publish 6379 on the public interface
# - AOF persistence for operational recovery; PostgreSQL remains authoritative for money

# Bind all interfaces inside the container so Compose DNS (valkey:6379) works.
# Public exposure is prevented by: (1) Cloud Firewall never opening 6379,
# (2) Compose `internal: true` network / no public publish in TTW-063,
# (3) requirepass. Do not bind only 127.0.0.1 — that breaks container-to-container access.
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize no
supervised no
loglevel notice

# Persistence (operational state only — not the system of record)
appendonly yes
appendfsync everysec
dir /data

# Capacity — must stay within the Droplet memory envelope (TTW-060)
maxmemory 256mb
maxmemory-policy noeviction

# Authentication — Compose/runtime must inject the password via --requirepass or
# an included secrets file. Prefer:
#   requirepass ${VALKEY_PASSWORD}
# supplied by the container entrypoint from the environment. Do not put the
# real password in this file.
# Placeholder token consumed by the Compose entrypoint (see compose.snippet.yml):
# REQUIREPASS_FROM_ENV=VALKEY_PASSWORD

# Dangerous commands off for shared-host blast-radius reduction
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
