# TTW-063 Compose snippet — host-local Valkey (not managed DO).
# Merge into the production Compose stack; do not publish 6379 on the host public IP.
#
# Required env (from TTW-065 secret store):
#   VALKEY_PASSWORD — non-empty shared secret for requirepass
#
# Example:
#   docker compose -f docker-compose.prod.yml up -d valkey

services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: tamiym-valkey
    restart: unless-stopped
    user: "999:999"
    env_file:
      - .env.valkey
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
    command:
      - sh
      - -c
      - |
        exec valkey-server /etc/valkey/valkey.conf --requirepass "$${VALKEY_PASSWORD}"
    volumes:
      - ./infra/runtime/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
      - valkey_data:/data
    networks:
      - tamiym_internal
    # Loopback-only publish if host networking tools need it; prefer Compose DNS.
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 288m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "valkey-cli -a \"$${VALKEY_PASSWORD}\" --no-auth-warning ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  valkey_data:

networks:
  tamiym_internal:
    internal: true
