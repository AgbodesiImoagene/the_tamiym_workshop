name: Release Rehearsal

# TTW-054 slice 2 — owner-gated release rehearsal (credential-free by default).
# Runs migration baseline proof, stop/go gate rehearsal, and backup invariant
# queries. Live isolated restore drills remain owner-gated via RESTORE_* env.
on:
  workflow_dispatch:
    inputs:
      run_backup_checklist:
        description: Run TTW-067 restore-isolated-check with fixture evidence
        required: true
        default: true
        type: boolean

jobs:
  migration-baseline:
    name: Migration baseline (blank + snapshot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tamiym_workshop_blank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tamiym_workshop_blank?schema=public
      DATABASE_URL_SNAPSHOT: postgresql://postgres:postgres@localhost:5432/tamiym_workshop_snapshot?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tamiym_workshop_blank_shadow?schema=public
      SHADOW_DATABASE_URL_SNAPSHOT: postgresql://postgres:postgres@localhost:5432/tamiym_workshop_snapshot_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Create snapshot and shadow databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE tamiym_workshop_snapshot;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE tamiym_workshop_blank_shadow;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE tamiym_workshop_snapshot_shadow;"
      - name: Verify blank database migration baseline
        run: pnpm release:verify-migrations
      - name: Verify snapshot database migration baseline
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_SNAPSHOT }}
          SHADOW_DATABASE_URL: ${{ env.SHADOW_DATABASE_URL_SNAPSHOT }}
        run: pnpm release:verify-migrations

  stop-go-rehearsal:
    name: Stop/go gate rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run stop/go gate scenarios
        run: pnpm release:rehearse-stop-go && pnpm release:validate:test

  backup-invariants:
    name: Backup invariant queries + checklist
    needs: [migration-baseline]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tamiym_workshop_snapshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tamiym_workshop_snapshot?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tamiym_workshop_snapshot_shadow?schema=public
      RESTORE_EVIDENCE_DIR: ${{ github.workspace }}/infra/release/fixtures/backup-evidence
      RESTORE_CONFIRM_TARGET: ttw-054-rehearsal-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations to snapshot database
        run: pnpm release:verify-migrations
      - name: Run post-restore invariant queries
        if: inputs.run_backup_checklist
        run: pnpm release:rehearse-backup
      - name: Upload rehearsal evidence marker
        if: inputs.run_backup_checklist
        uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal-evidence-${{ github.sha }}
          path: infra/release/fixtures/backup-evidence/
          if-no-files-found: error
