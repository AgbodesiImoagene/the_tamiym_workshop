name: Playwright Matrix

# TTW-176: the full browser matrix (`pnpm test:e2e:matrix`): Chromium, Firefox,
# WebKit, mobile Chromium (Pixel 5), mobile WebKit (iPhone 13), accessibility
# and the stable visual baselines. Nightly and on manual dispatch only: it is
# too long for every push. Both triggers only work once this file is on the
# default branch.
on:
  schedule:
    # One hour after playwright-comprehensive.yml (02:00 UTC).
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: >-
          Regenerate the visual baselines on Linux and upload them as an
          artefact for review, instead of running the matrix. Nothing is
          committed: review the images, then commit them by hand.
        type: boolean
        default: false

# One matrix run per ref at a time. A nightly run and a manual run test the same
# commit, so a second trigger waits for the first instead of cancelling it.
# GitHub keeps at most one pending run per group (a newer pending run replaces
# an older one), so two runs never compete. Baseline regeneration has its own
# group so a nightly run can never drop a queued regeneration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.update_snapshots && 'snapshots' || 'matrix' }}
  cancel-in-progress: false

jobs:
  playwright-matrix:
    name: Playwright Browser Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tamiym_workshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tamiym_workshop_test?schema=public
      JWT_ACCESS_SECRET: test-access-secret-ttw003-not-for-prod
      JWT_REFRESH_SECRET: test-refresh-secret-ttw003-not-for-prod
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      MFA_TOTP_ENCRYPTION_KEY: zghUm6jv4icb3WT8MzKea1lMrsgir7rONaShtv10zdQ=
      PAYSTACK_SECRET_KEY: sk_test_mock
      PAYSTACK_PUBLIC_KEY: pk_test_mock
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 15
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      LOG_LEVEL: error
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_URL: http://localhost:9000/tamiym-assets
      S3_BUCKET: tamiym-assets
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1
      NEXT_PUBLIC_CUSTOMER_APP_URL: http://localhost:3002
      NEXT_PUBLIC_ADMIN_APP_URL: http://localhost:3003
      PLAYWRIGHT_API_URL: http://localhost:3001
      PLAYWRIGHT_WEB_URL: http://localhost:3000
      PLAYWRIGHT_APP_URL: http://localhost:3002
      PLAYWRIGHT_ADMIN_URL: http://localhost:3003
      CORS_ORIGIN: http://localhost:3000,http://localhost:3002,http://localhost:3003
      PORT: '3001'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy
      - name: Seed e2e identities
        run: pnpm --filter api seed:e2e
      - name: Install Playwright browsers
        if: ${{ inputs.update_snapshots != true }}
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install Playwright Chromium (baselines only)
        if: ${{ inputs.update_snapshots == true }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Production build
        run: pnpm build
      - name: Run Playwright browser matrix
        if: ${{ inputs.update_snapshots != true }}
        timeout-minutes: 55
        # CI keeps retries: 1 (playwright.config.ts). A test that passes only on
        # its retry is a flake: fail the run instead of reporting green.
        run: pnpm test:e2e:matrix --fail-on-flaky-tests
      - name: Regenerate visual baselines
        if: ${{ inputs.update_snapshots == true }}
        timeout-minutes: 15
        run: pnpm exec playwright test --project=setup --project=chromium-visual --project=mobile-visual-web --update-snapshots=all
      - name: Upload visual baselines for review
        if: ${{ inputs.update_snapshots == true }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-baselines
          path: tests/e2e/visual/**/*-snapshots/**
          if-no-files-found: error
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-matrix-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
