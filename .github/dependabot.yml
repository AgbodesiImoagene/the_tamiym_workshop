version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - 'next'
          - 'eslint-config-next'
          - 'react'
          - 'react-dom'
      api-observability:
        patterns:
          - '@opentelemetry/*'
      api-aws:
        patterns:
          - '@aws-sdk/*'
      nest-core:
        patterns:
          - '@nestjs/*'
    labels:
      - dependencies
    reviewers:
      - AgbodesiImoagene
